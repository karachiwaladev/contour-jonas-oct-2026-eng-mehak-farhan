<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Todo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-task" class="new-task" autocomplete="off">
      <div class="row">
        <label for="task-title" class="visually-hidden">New task</label>
        <input id="task-title" name="title" type="text" placeholder="What needs doing?" required maxlength="200">
        <button type="submit">Add</button>
      </div>
      <div class="row extras">
        <label class="field">
          <span>Due</span>
          <input id="task-due" name="due" type="datetime-local">
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="task-tags" name="tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="task-repeat" name="repeat">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="task-priority" name="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
      </div>
    </form>

    <section class="filters" aria-label="Filters">
      <div class="status-filter" role="group" aria-label="Show">
        <button type="button" data-status="all" aria-pressed="true">All <span class="count" data-count="all"></span></button>
        <button type="button" data-status="open" aria-pressed="false">Incomplete <span class="count" data-count="open"></span></button>
        <button type="button" data-status="done" aria-pressed="false">Completed <span class="count" data-count="done"></span></button>
      </div>
      <div id="priority-filter" class="tag-filter" role="group" aria-label="Filter by priority (matches any)">
        <span class="tag-filter-label">Priority:</span>
        <span id="priority-chips" class="tag-chips">
          <button type="button" class="tag tag-toggle priority-toggle" data-priority="high" aria-pressed="false">High</button>
          <button type="button" class="tag tag-toggle priority-toggle" data-priority="medium" aria-pressed="false">Medium</button>
          <button type="button" class="tag tag-toggle priority-toggle" data-priority="low" aria-pressed="false">Low</button>
        </span>
      </div>
      <div id="tag-filter" class="tag-filter" role="group" aria-label="Filter by tags (matches any)" hidden>
        <span class="tag-filter-label">Tags:</span>
        <span id="tag-chips" class="tag-chips"></span>
        <button type="button" id="clear-tags" class="link" hidden>Clear</button>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add one above.</p>
  </main>

  <script src="db.js"></script>
  <script src="priority.js"></script>
  <script src="filters.js"></script>
  <script src="recurrence.js"></script>
  <script src="render.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
