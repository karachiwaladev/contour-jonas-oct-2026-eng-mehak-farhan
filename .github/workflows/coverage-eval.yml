name: Coverage eval

# Measures coverage of the files a finished ticket changed and posts the scorecard on it. Runs when a "Ticket ..."
# issue is closed as completed, or on demand: Actions -> Coverage eval -> Run workflow -> ticket number.
# Two jobs, so the job that runs a ticket's tests never holds a token that can write (ticket #28):
#   eval  checks out the code and runs the tests with a read-only token, then uploads the scorecard as a file;
#   post  has issues: write but never checks out or runs any code; it only posts that file on the ticket.
on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Ticket (issue) number to evaluate'
        required: true

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.state_reason == 'completed' && startsWith(github.event.issue.title, 'Ticket'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the eval checks out the ticket's final commit in a worktree
          persist-credentials: false # never leave the token in .git/config, where test code could read it

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run coverage eval (read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: /usr/bin/google-chrome
          TICKET: ${{ github.event.issue.number || inputs.ticket }}
        run: |
          node .claude/tools/evals/coverage-eval.js "$TICKET" --json eval.json --md eval.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-eval
          path: |
            eval.json
            eval.md
          if-no-files-found: ignore

  post:
    needs: eval
    # Post even when a file scored FAIL (the eval job exits 1 then), but not when the eval was skipped or cancelled.
    if: always() && (needs.eval.result == 'success' || needs.eval.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # no artifact when there was nothing to measure
        with:
          name: coverage-eval

      - name: Post the scorecard on the ticket
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TICKET: ${{ github.event.issue.number || inputs.ticket }}
        run: |
          if [ -f eval.md ]; then gh issue comment "$TICKET" --body-file eval.md; else echo "No scorecard to post."; fi
